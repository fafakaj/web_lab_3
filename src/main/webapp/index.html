<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список студентов</title>
    <link rel="icon" href="image.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <div class="header-row">
        <h1>Управление студентами</h1>
        <p id="user-panel" class="user-panel" hidden>
            <span id="user-name"></span>
            <button type="button" id="logout-button">Выйти</button>
        </p>
    </div>
    <nav>
        <a href="index.html">Список студентов</a>
        <a href="student-form.html" class="admin-only" hidden>Добавить студента</a>
    </nav>
</header>

<main>
    <h2>Список студентов</h2>

    <p class="admin-only" hidden>
        <a class="button" href="student-form.html">Добавить студента</a>
    </p>

    <form id="filters" class="filters" method="get" action="index.html">
        <p>
            <label for="filter-full_name">ФИО</label>
            <input type="text" id="filter-full_name" name="full_name" minlength="2" maxlength="100"
                   pattern="[A-Za-zА-ЯЁа-яё' \-]+" placeholder="Иванов"
                   title="Буквы, пробел, дефис или апостроф; можно часть фамилии">
        </p>

        <p>
            <label for="filter-group">Группа</label>
            <input type="text" id="filter-group" name="group" minlength="5" maxlength="5"
                   pattern="[A-Za-z]\d{4}" placeholder="M3301"
                   title="Латинская буква и четыре цифры, например M3301">
        </p>

        <p>
            <label for="filter-dormitory">Общежитие</label>
            <select id="filter-dormitory" name="dormitory">
                <option value="">Все</option>
            </select>
        </p>

        <p>
            <label for="filter-room">Комната</label>
            <input type="text" id="filter-room" name="room" minlength="4" maxlength="4"
                   pattern="[1-9]\d{3}" inputmode="numeric" placeholder="1205"
                   title="Ровно четыре цифры, первая не 0, например 1205">
        </p>

        <p>
            <label for="filter-is_foreign">Иностранец</label>
            <select id="filter-is_foreign" name="is_foreign">
                <option value="">Все</option>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </p>

        <p>
            <label for="filter-living">Проживает сейчас</label>
            <select id="filter-living" name="living">
                <option value="">Все</option>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </p>

        <p>
            <label for="filter-sort">Сортировать по</label>
            <select id="filter-sort" name="sort">
                <option value="full_name">ФИО</option>
                <option value="group">Группе</option>
                <option value="isu_id">ИСУ</option>
                <option value="dormitory">Общежитию</option>
                <option value="room">Комнате</option>
                <option value="check_in">Дате заселения</option>
                <option value="check_out">Дате выселения</option>
            </select>
        </p>

        <p>
            <label for="filter-order">Порядок</label>
            <select id="filter-order" name="order">
                <option value="asc">По возрастанию</option>
                <option value="desc">По убыванию</option>
            </select>
        </p>

        <p>
            <label for="filter-size">Студентов на странице</label>
            <select id="filter-size" name="size">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
        </p>

        <p class="filters-actions">
            <button type="submit" class="button-primary">Найти</button>
            <a class="button" href="index.html">Сбросить</a>
        </p>
    </form>

    <p id="status" class="status-line" role="status"></p>

    <table id="students-table">
        <thead>
        <tr>
            <th>ФИО</th>
            <th>Группа</th>
            <th>ИСУ id</th>
            <th>Общежитие</th>
            <th>Комната</th>
            <th>Срок заселения</th>
            <th>Иностранец</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <nav id="pagination" class="pagination" aria-label="Страницы списка"></nav>
</main>

<footer>
    <p>Лабораторная работа №3</p>
</footer>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/list.js"></script>

</body>
</html>
