# База данных PostgreSQL для приложения.
# Запуск: docker compose up -d   Остановка: docker compose down
# Имя БД, логин, пароль и порт берутся из файла .env (тот же файл читает и сервер приложения).
services:
  db:
    image: postgres:16
    container_name: web_lab_3_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Данные лежат в томе Docker и не пропадают после docker compose down
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

volumes:
  db-data:
